<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Рубеж">
<title>Рубеж</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  :root {
    --bg: #0f172a; --card-bg: #1e293b; --btn-bg: #334155; --btn-hover: #475569;
    --text: #e2e8f0; --text-dim: #94a3b8; --text-mid: #cbd5e1; --text-bright: #f1f5f9;
    --accent: #2563eb; --accent-hover: #1d4ed8;
    --border-muted: #475569; --progress-bg: #334155;
    --explain-bg: #0f172a;
    --correct: #16a34a; --wrong: #dc2626;
    --badge-bg: #334155; --badge-text: #cbd5e1;
    --warn-bg: #7c2d12; --warn-text: #fed7aa;
    --ok-bg: #14532d; --ok-text: #bbf7d0;
    --input-bg: #0f172a; --input-border: #475569;
    --danger: #dc2626; --danger-hover: #b91c1c;
  }
  body.light {
    --bg: #f1f5f9; --card-bg: #ffffff; --btn-bg: #e2e8f0; --btn-hover: #cbd5e1;
    --text: #0f172a; --text-dim: #64748b; --text-mid: #475569; --text-bright: #0f172a;
    --accent: #2563eb; --accent-hover: #1d4ed8;
    --border-muted: #cbd5e1; --progress-bg: #e2e8f0;
    --explain-bg: #f8fafc;
    --badge-bg: #e2e8f0; --badge-text: #475569;
    --warn-bg: #fed7aa; --warn-text: #7c2d12;
    --ok-bg: #bbf7d0; --ok-text: #14532d;
    --input-bg: #ffffff; --input-border: #cbd5e1;
  }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh; font-size: clamp(15px, 4.2vw, 17px); line-height: 1.55; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); padding-bottom: env(safe-area-inset-bottom); transition: background .2s, color .2s; }
  .wrap { max-width: 820px; margin: 0 auto; padding: clamp(12px, 3.5vw, 18px); }
  h1 { font-size: clamp(20px, 5.5vw, 24px); margin: 4px 0 16px; }
  h2 { font-size: clamp(17px, 4.6vw, 19px); margin: 0 0 10px; }
  h3 { font-size: clamp(15px, 4vw, 16.5px); margin: 14px 0 8px; color: var(--text-bright); }
  .menu-header { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 16px; gap: 10px; flex-wrap: wrap; }
  .menu-header h1 { margin: 0; }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .user-badge { background: var(--btn-bg); border-radius: 10px; padding: 6px 12px; font-size: clamp(12px, 3.4vw, 13.5px); color: var(--text-dim); white-space: nowrap; }
  .user-badge b { color: var(--text-bright); }
  .theme-btn { background: var(--btn-bg); border: none; border-radius: 10px; font-size: 18px; padding: 8px 12px; cursor: pointer; color: var(--text); line-height: 1; flex-shrink: 0; }
  .card { background: var(--card-bg); border-radius: clamp(12px, 3vw, 16px); padding: clamp(14px, 4vw, 20px); margin-bottom: clamp(10px, 3vw, 14px); box-shadow: 0 4px 14px rgba(0,0,0,.15); overflow-wrap: break-word; }
  .btn { display: block; width: 100%; padding: clamp(13px, 3.8vw, 15px) clamp(14px, 4vw, 18px); margin: 8px 0; background: var(--btn-bg); color: var(--text); border: none; border-radius: clamp(10px, 2.5vw, 12px); font-size: clamp(14.5px, 4vw, 16px); line-height: 1.4; text-align: left; cursor: pointer; transition: background .15s; font-family: inherit; min-height: 50px; overflow-wrap: break-word; }
  @media (hover: hover) { .btn:hover { background: var(--btn-hover); } .btn.primary:hover { background: var(--accent-hover); } .btn.danger:hover { background: var(--danger-hover); } }
  .btn.primary { background: var(--accent); text-align: center; font-weight: 600; color: #fff; }
  .btn.danger { background: var(--danger); text-align: center; color: #fff; }
  .btn.correct { background: var(--correct) !important; color: #fff; }
  .btn.wrong { background: var(--wrong) !important; color: #fff; }
  .btn:disabled { cursor: default; opacity: .5; }
  .btn.back { background: transparent; color: var(--text-dim); text-align: center; }
  .btn.small { min-height: 38px; padding: 8px 12px; font-size: clamp(13px, 3.5vw, 14px); margin: 4px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row .btn { flex: 1; text-align: center; min-width: 100px; }
  .meta { font-size: clamp(12px, 3.4vw, 13.5px); color: var(--text-dim); margin-bottom: 8px; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; background: var(--badge-bg); font-size: clamp(11.5px, 3.2vw, 12.5px); color: var(--badge-text); margin: 2px 4px 2px 0; }
  .badge.ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-text); }
  .badge.admin { background: #7c2d12; color: #fed7aa; }
  .badge.chief { background: #1e40af; color: #dbeafe; }
  .badge.cadet { background: #14532d; color: #bbf7d0; }
  .badge.red { background: #7f1d1d; color: #fecaca; }
  .badge.yellow { background: #78350f; color: #fde68a; }
  .badge.green { background: #14532d; color: #bbf7d0; }
  .center { text-align: center; }
  .big { font-size: clamp(36px, 11vw, 46px); font-weight: 700; margin: 8px 0; line-height: 1.1; }
  .block-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .block-title h2 { margin: 0; }
  .counter { font-size: clamp(12px, 3.4vw, 13.5px); color: var(--text-dim); white-space: nowrap; }
  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .topbar .back-btn { background: var(--btn-bg); color: var(--text); border: none; border-radius: 10px; padding: 8px 14px; font-size: 18px; cursor: pointer; font-family: inherit; min-height: 40px; min-width: 44px; display: flex; align-items: center; justify-content: center; line-height: 1; }
  .topbar .title { flex: 1; font-size: clamp(12px, 3.4vw, 14px); color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .warn-box { background: var(--warn-bg); color: var(--warn-text); padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; line-height: 1.5; }
  .info-box { background: var(--btn-bg); color: var(--text-mid); padding: 12px; border-radius: 10px; font-size: 13.5px; margin-bottom: 12px; line-height: 1.5; }
  .input { width: 100%; padding: 13px 15px; font-size: clamp(15px, 4vw, 16px); background: var(--input-bg); border: 1.5px solid var(--input-border); color: var(--text); border-radius: 10px; font-family: inherit; margin-bottom: 10px; -webkit-appearance: none; }
  .input:focus { outline: none; border-color: var(--accent); }
  .textarea { width: 100%; min-height: 90px; padding: 13px 15px; font-size: clamp(14.5px, 3.8vw, 15.5px); background: var(--input-bg); border: 1.5px solid var(--input-border); color: var(--text); border-radius: 10px; font-family: inherit; margin-bottom: 10px; line-height: 1.5; resize: vertical; -webkit-appearance: none; }
  .textarea:focus { outline: none; border-color: var(--accent); }
  label.field-label { display: block; font-size: clamp(13px, 3.6vw, 14.5px); color: var(--text-mid); margin-bottom: 6px; margin-top: 8px; }
  .q-text { font-size: clamp(16px, 4.6vw, 18px); line-height: 1.45; margin-bottom: 14px; font-weight: 500; }
  .progress { height: 6px; background: var(--progress-bg); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
  .item-card { background: var(--card-bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border: 1px solid transparent; transition: background .15s; }
  .item-card.clickable { cursor: pointer; }
  @media (hover: hover) { .item-card.clickable:hover { border-color: var(--border-muted); } }
  .item-card .item-title { font-size: clamp(14.5px, 4vw, 16px); font-weight: 600; line-height: 1.4; color: var(--text-bright); margin-bottom: 4px; }
  .item-card .item-sub { font-size: clamp(12px, 3.4vw, 13.5px); color: var(--text-dim); line-height: 1.4; }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 15px; }
  .empty-state .big-emoji { font-size: 48px; margin-bottom: 12px; display: block; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: clamp(12.5px, 3.5vw, 14px); }
  table.data-table th, table.data-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border-muted); vertical-align: top; }
  table.data-table th { color: var(--text-dim); font-weight: 600; font-size: clamp(11.5px, 3.2vw, 13px); }
  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
  .opt-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .opt-row .input { margin-bottom: 0; flex: 1; }
  .opt-row .opt-marker { min-width: 34px; height: 42px; display: flex; align-items: center; justify-content: center; background: var(--btn-bg); border-radius: 8px; font-weight: 700; color: var(--text-dim); font-size: 15px; }
  .opt-row .opt-marker.correct { background: var(--correct); color: #fff; }
  .opt-row .btn.del { min-width: 40px; height: 42px; min-height: 42px; padding: 0; margin: 0; text-align: center; font-size: 18px; flex: 0 0 42px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: flex-start; justify-content: center; padding: 16px; z-index: 1000; overflow-y: auto; }
  .modal { background: var(--card-bg); border-radius: 14px; padding: 20px; max-width: 520px; width: 100%; max-height: 88vh; overflow-y: auto; margin: auto; }
  .modal h3 { margin-top: 0; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
  .modal-actions .btn { flex: 1; text-align: center; }
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border-muted); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .auth-tabs { display: flex; gap: 0; margin-bottom: 16px; background: var(--btn-bg); border-radius: 10px; padding: 4px; }
  .auth-tab { flex: 1; padding: 10px; text-align: center; border-radius: 8px; cursor: pointer; font-size: clamp(13.5px, 3.8vw, 15px); color: var(--text-dim); transition: .15s; border: none; background: transparent; font-family: inherit; }
  .auth-tab.active { background: var(--card-bg); color: var(--text-bright); font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  /* Кабинет начальника */
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--btn-bg); border-radius: 12px; padding: 14px 12px; text-align: center; }
  .kpi .kpi-value { font-size: clamp(22px, 6vw, 28px); font-weight: 700; color: var(--text-bright); line-height: 1.1; margin-bottom: 4px; }
  .kpi .kpi-label { font-size: clamp(11.5px, 3.2vw, 12.5px); color: var(--text-dim); }
  .top-q-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--border-muted); }
  .top-q-row:last-child { border-bottom: none; }
  .top-q-rank { font-size: 18px; font-weight: 700; color: var(--warn-text); min-width: 26px; flex-shrink: 0; }
  .top-q-body { flex: 1; }
  .top-q-text { font-size: clamp(13.5px, 3.8vw, 15px); line-height: 1.45; color: var(--text); margin-bottom: 4px; }
  .top-q-meta { font-size: clamp(11.5px, 3.2vw, 12.5px); color: var(--text-dim); }
  .err-card { background: var(--card-bg); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--wrong); }
  .err-card .err-q { font-size: clamp(13.5px, 3.8vw, 15px); font-weight: 500; color: var(--text-bright); margin-bottom: 6px; }
  .err-card .err-opts { font-size: clamp(12.5px, 3.5vw, 14px); line-height: 1.55; color: var(--text-mid); }
  .err-card .err-opts .correct { color: var(--correct); font-weight: 600; }
  .err-card .err-opts .selected-wrong { color: var(--wrong); font-weight: 600; }
  .err-card .err-count { font-size: clamp(11.5px, 3.2vw, 12.5px); color: var(--text-dim); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty-state"><span class="spinner"></span>Загрузка...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// КОНФИГ
// ============================================================
const SUPABASE_URL = 'https://jxcsxmzbwnxysvuhbazh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_btY4fIAVgCY26CeB3KsreA_zHfvhip8';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SHOW_EXPLAIN_DURING_TEST = false;

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const state = {
  session: null,
  profile: null,
  screen: 'loading',
  theme: localStorage.getItem('rubezh_theme') || 'dark',
  currentBlock: null,
  currentAttempt: null,
  allUsers: [],
};

// ============================================================
// УТИЛИТЫ
// ============================================================
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const TRANSLIT = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'ts','ч':'ch','ш':'sh','щ':'shch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya',' ':'','_':'','-':''};
function callsignToEmail(c) {
  const clean = c.trim().toLowerCase();
  let out = '';
  for (const ch of clean) {
    if (TRANSLIT[ch] !== undefined) out += TRANSLIT[ch];
    else if (/[a-z0-9]/.test(ch)) out += ch;
  }
  if (!out) out = 'user' + Date.now();
  return out + '@rubezh.local';
}
function applyTheme() { document.body.classList.toggle('light', state.theme === 'light'); localStorage.setItem('rubezh_theme', state.theme); }
function toggleTheme() { state.theme = state.theme === 'light' ? 'dark' : 'light'; applyTheme(); render(); }
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' });
}
const app = document.getElementById('app');

// ============================================================
// МОДАЛКИ
// ============================================================
function showModal(html) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modalOverlay';
  ov.onclick = (e) => { if (e.target === ov) closeModal(); };
  ov.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(ov);
}
function closeModal() { const ov = document.getElementById('modalOverlay'); if (ov) ov.remove(); }

// ============================================================
// АВТОРИЗАЦИЯ
// ============================================================
async function loadProfile() {
  if (!state.session) { state.profile = null; return; }
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  if (error) { console.error(error); state.profile = null; return; }
  state.profile = data;
}
async function signUp(callsign, password) {
  const email = callsignToEmail(callsign);
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { callsign } } });
  if (error) throw error;
  if (!data.session) throw new Error('Аккаунт создан, но вход не выполнен.');
  state.session = data.session; await loadProfile();
}
async function signIn(callsign, password) {
  const email = callsignToEmail(callsign);
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  state.session = data.session; await loadProfile();
}
async function signOut() {
  await sb.auth.signOut();
  state.session = null; state.profile = null; state.screen = 'auth'; render();
}

// ============================================================
// АВТОРИЗАЦИЯ UI
// ============================================================
function renderAuth() {
  state.screen = 'auth';
  app.innerHTML = `
    <div class="menu-header"><h1>🎯 Рубеж</h1>
      <button class="theme-btn" onclick="toggleTheme()">${state.theme === 'light' ? '🌙' : '☀️'}</button></div>
    <div class="card"><p class="meta" style="text-align:center;margin:0">Система тестирования стажёров</p></div>
    <div class="card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Вход</button>
        <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Регистрация</button>
      </div>
      <div id="authForm"></div>
    </div>`;
  renderAuthForm('login');
}
function switchAuthTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  renderAuthForm(tab);
}
function renderAuthForm(tab) {
  const form = document.getElementById('authForm');
  if (tab === 'login') {
    form.innerHTML = `
      <label class="field-label">Позывной</label>
      <input class="input" id="loginCallsign" placeholder="Например: Гром" autocapitalize="words">
      <label class="field-label">Пароль</label>
      <input class="input" id="loginPassword" type="password" placeholder="Пароль">
      <div id="loginError" class="warn-box hidden"></div>
      <button class="btn primary" id="loginBtn" onclick="doLogin()">Войти</button>`;
  } else {
    form.innerHTML = `
      <label class="field-label">Позывной</label>
      <input class="input" id="regCallsign" placeholder="Придумайте позывной (без ФИО!)" autocapitalize="words">
      <div class="meta" style="margin:-4px 0 8px">Не используйте фамилию, имя, отчество</div>
      <label class="field-label">Пароль</label>
      <input class="input" id="regPassword" type="password" placeholder="Минимум 6 символов">
      <label class="field-label">Пароль ещё раз</label>
      <input class="input" id="regPassword2" type="password" placeholder="Повторите пароль">
      <div class="info-box">Регистрируясь, вы соглашаетесь на обработку позывного и результатов в целях подготовки.</div>
      <div id="regError" class="warn-box hidden"></div>
      <button class="btn primary" id="regBtn" onclick="doRegister()">Зарегистрироваться</button>`;
  }
}
async function doLogin() {
  const c = document.getElementById('loginCallsign').value.trim();
  const p = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  err.classList.add('hidden');
  if (!c || !p) { err.textContent = 'Введите позывной и пароль'; err.classList.remove('hidden'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Вход...';
  try { await signIn(c, p); render(); }
  catch (e) { err.textContent = 'Неверный позывной или пароль'; err.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Войти'; }
}
async function doRegister() {
  const c = document.getElementById('regCallsign').value.trim();
  const p = document.getElementById('regPassword').value;
  const p2 = document.getElementById('regPassword2').value;
  const err = document.getElementById('regError');
  const btn = document.getElementById('regBtn');
  err.classList.add('hidden');
  if (!c || c.length < 2) { err.textContent = 'Позывной не короче 2 символов'; err.classList.remove('hidden'); return; }
  if (p.length < 6) { err.textContent = 'Пароль минимум 6 символов'; err.classList.remove('hidden'); return; }
  if (p !== p2) { err.textContent = 'Пароли не совпадают'; err.classList.remove('hidden'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Создание...';
  try { await signUp(c, p); render(); }
  catch (e) { err.textContent = e.message || 'Ошибка регистрации'; err.classList.remove('hidden'); btn.disabled = false; btn.textContent = 'Зарегистрироваться'; }
}

// ============================================================
// ГЛАВНОЕ МЕНЮ
// ============================================================
function renderMenu() {
  state.screen = 'menu';
  const role = state.profile?.role || 'cadet';
  const roleLabel = role === 'admin' ? 'Администратор' : role === 'chief' ? 'Начальник' : 'Стажёр';
  let html = `
    <div class="menu-header">
      <h1>🎯 Рубеж</h1>
      <div class="header-right">
        <span class="user-badge"><b>${escapeHtml(state.profile?.callsign || '')}</b> · ${roleLabel}</span>
        <button class="theme-btn" onclick="toggleTheme()">${state.theme === 'light' ? '🌙' : '☀️'}</button>
      </div>
    </div>`;
  html += `<div class="card">
    <div class="block-title"><h2>📚 Тесты</h2></div>
    <div class="meta">Прохождение тестов по блокам</div>
    <button class="btn primary" onclick="renderTestsMenu()">Открыть</button>
  </div>`;
  html += `<div class="card">

async function startTest(blockId) {
  app.innerHTML = `<div class="empty-state"><span class="spinner"></span>Подготовка...</div>`;
  const { data: block } = await sb.from('blocks').select('*').eq('id', blockId).single();
  const { data: questions, error: qErr } = await sb.from('questions').select('*').eq('block_id', blockId).order('order_index').order('created_at');
  if (qErr || !questions || questions.length === 0) { alert('Не удалось загрузить вопросы'); renderTestsMenu(); return; }
  const shuffled = questions.slice().sort(() => Math.random() - 0.5);
  const { data: attempt, error: aErr } = await sb.from('attempts').insert({ user_id: state.session.user.id, block_id: blockId, total: shuffled.length }).select().single();
  if (aErr) { alert('Ошибка: ' + aErr.message); renderTestsMenu(); return; }
  state.currentBlock = block;
  state.currentAttempt = { id: attempt.id, blockId, questions: shuffled, index: 0, answers: [], finished: false };
  renderQuestionScreen();
}
function renderQuestionScreen() {
  state.screen = 'question';
  const att = state.currentAttempt;
  const q = att.questions[att.index];
  const letters = ['а','б','в','г','д','е'];
  const pct = Math.round((att.index / att.questions.length) * 100);
  const options = Array.isArray(q.options) ? q.options : [];
  app.innerHTML = `
    <div class="topbar"><button class="back-btn" onclick="confirmExitTest()">←</button>
      <div class="title">${escapeHtml(state.currentBlock.name)} · ${att.index + 1} из ${att.questions.length}</div></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="card">
      <div class="q-text">${att.index + 1}. ${escapeHtml(q.text)}</div>
      <div id="optionsBlock"></div>
      <div id="explainBlock"></div>
      <div id="nextBlock"></div>
    </div>`;
  window.scrollTo(0, 0);
  const ob = document.getElementById('optionsBlock');
  options.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.innerHTML = `<span style="font-weight:700">${letters[i]})</span> ${escapeHtml(text)}`;
    b.onclick = () => answerQuestion(i);
    ob.appendChild(b);
  });
}
function confirmExitTest() {
  if (confirm('Прервать тест? Результат не сохранится.')) {
    if (state.currentAttempt?.id) sb.from('attempts').delete().eq('id', state.currentAttempt.id).then(() => {});
    state.currentAttempt = null;
    renderTestsMenu();
  }
}
async function answerQuestion(sel) {
  const att = state.currentAttempt;
  const q = att.questions[att.index];
  const isCorrect = sel === q.correct_index;
  await sb.from('answers').insert({ attempt_id: att.id, question_id: q.id, selected_index: sel, is_correct: isCorrect });
  att.answers.push({ questionId: q.id, selectedIndex: sel, isCorrect });
  document.querySelectorAll('#optionsBlock .btn').forEach((b, idx) => {
    b.disabled = true;
    if (SHOW_EXPLAIN_DURING_TEST) {
      if (idx === q.correct_index) b.classList.add('correct');
      else if (idx === sel) b.classList.add('wrong');
    }
  });
  if (SHOW_EXPLAIN_DURING_TEST) {
    const e = document.getElementById('explainBlock');
    e.innerHTML = `<div style="background: var(--explain-bg); border-left: 4px solid var(--${isCorrect ? 'correct' : 'wrong'}); padding: 12px 14px; border-radius: 8px; margin-top: 14px;">
      <b>${isCorrect ? '✅ Верно!' : '❌ Неверно'}</b><br><br>${q.explain || ''}</div>`;
  }
  const n = document.getElementById('nextBlock');
  n.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'btn primary';
  const isLast = att.index + 1 >= att.questions.length;
  btn.textContent = isLast ? '🏁 Завершить тест' : 'Следующий вопрос →';
  btn.onclick = () => { if (isLast) finishTest(); else { att.index++; renderQuestionScreen(); } };
  n.appendChild(btn);
  btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
async function finishTest() {
  const att = state.currentAttempt;
  const score = att.answers.filter(a => a.isCorrect).length;
  const total = att.questions.length;
  await sb.from('attempts').update({ finished_at: new Date().toISOString(), score, total }).eq('id', att.id);
  state.currentAttempt = { ...att, finished: true, score, total };
  renderTestResult();
}
function renderTestResult() {
  state.screen = 'testResult';
  const att = state.currentAttempt;
  const pct = Math.round((att.score / att.total) * 100);
  const grade = pct >= 90 ? 'отлично' : pct >= 75 ? 'хорошо' : pct >= 60 ? 'удовлетворительно' : 'неудовлетворительно';
  app.innerHTML = `
    <div class="topbar"><button class="back-btn" onclick="closeTestResult()">←</button>
      <div class="title">${escapeHtml(state.currentBlock.name)}</div></div>
    <div class="card center"><h2>Результат</h2>
      <div class="big">${att.score} / ${att.total}</div>
      <div class="meta">${pct}% правильных · ${grade}</div></div>
    <div class="card">
      <div class="info-box">Разбор ошибок проведёт ваш руководитель.</div>
      <button class="btn primary" onclick="renderTestsMenu()">← К тестам</button>
      <button class="btn" onclick="renderMyResults()">📊 Все мои результаты</button>
      <button class="btn back" onclick="renderMenu()">← Главное меню</button>
    </div>`;
  window.scrollTo(0, 0);
}

async function openQuestionEditor(questionId) {
  let q = null;

    const { data } = await sb.from('questions').select('*').eq('id', questionId).single();
    q = data;
  }
  let opts = q && Array.isArray(q.options) ? q.options.slice() : ['', '', ''];
  while (opts.length < 2) opts.push('');
  window.__qOptions = opts;
  window.__qCorrectIdx = q?.correct_index ?? 0;
  showModal(`
    <h3>${questionId ? 'Редактировать вопрос' : 'Новый вопрос'}</h3>
    <label class="field-label">Текст вопроса</label>

    <div class="meta" style="margin-top:-4px;margin-bottom:8px">Нажмите на букву, чтобы отметить правильный вариант</div>
    <div id="optionsContainer"></div>
    <button class="btn small" id="addOptBtn" type="button">+ Добавить вариант</button>
    <label class="field-label" style="margin-top:12px">Объяснение (необязательно)</label>
    <textarea class="textarea" id="qExplain" placeholder="Почему этот ответ правильный...">${escapeHtml(q?.explain || '')}</textarea>
    <div id="questionModalError" class="warn-box hidden"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Отмена</button>
      <button class="btn primary" onclick="saveQuestion('${questionId || ''}')">Сохранить</button>
    </div>`);
  document.getElementById('addOptBtn').onclick = addOption;
  renderOptionsEditor();
}
function syncOptionsFromDOM() {
  const c = document.getElementById('optionsContainer');
  if (!c) return;
  const inputs = c.querySelectorAll('input.input');
  window.__qOptions = Array.from(inputs).map(inp => inp.value);
}
function renderOptionsEditor() {
  const c = document.getElementById('optionsContainer');
  if (!c) return;
  const letters = ['а','б','в','г','д','е','ж','з'];
  const correct = window.__qCorrectIdx ?? 0;
  c.innerHTML = window.__qOptions.map((opt, i) => `
    <div class="opt-row">
      <div class="opt-marker ${i === correct ? 'correct' : ''}" onclick="setCorrectOption(${i})" style="cursor:pointer" title="Отметить правильным">${letters[i]}</div>
      <input class="input" value="${escapeHtml(opt)}" placeholder="Вариант ${letters[i]}">
      ${window.__qOptions.length > 2 ? `<button class="btn del" onclick="removeOption(${i})" type="button">🗑</button>` : ''}
    </div>`).join('');
}
function setCorrectOption(idx) { syncOptionsFromDOM(); window.__qCorrectIdx = idx; renderOptionsEditor(); }
function addOption() {
  syncOptionsFromDOM();
  if (window.__qOptions.length >= 8) return;
  window.__qOptions.push('');
  renderOptionsEditor();
}
function removeOption(idx) {
  syncOptionsFromDOM();
  if (window.__qOptions.length <= 2) return;
  window.__qOptions.splice(idx, 1);
  if (window.__qCorrectIdx >= window.__qOptions.length) window.__qCorrectIdx = 0;
  else if (window.__qCorrectIdx > idx) window.__qCorrectIdx--;
  renderOptionsEditor();
}
async function saveQuestion(questionId) {
  syncOptionsFromDOM();
  const text = document.getElementById('qText').value.trim();
  const explain = document.getElementById('qExplain').value.trim();
  const err = document.getElementById('questionModalError');
  err.classList.add('hidden');
  const options = window.__qOptions.map(o => (o || '').trim()).filter(o => o.length > 0);
  if (!text) { err.textContent = 'Введите текст вопроса'; err.classList.remove('hidden'); return; }
  if (options.length < 2) { err.textContent = 'Нужно минимум 2 варианта ответа'; err.classList.remove('hidden'); return; }
  let correct = window.__qCorrectIdx;
  if (correct >= options.length) correct = 0;
  const payload = { block_id: state.currentBlock.id, text, options, correct_index: correct, explain };
  let result;
  if (questionId) result = await sb.from('questions').update(payload).eq('id', questionId);
  else result = await sb.from('questions').insert(payload);
  if (result.error) { err.textContent = 'Ошибка: ' + result.error.message; err.classList.remove('hidden'); return; }
  closeModal();
  renderAdminQuestions(state.currentBlock.id);
}
async function deleteQuestion(questionId) {
  if (!confirm('Удалить вопрос? Это необратимо.')) return;
  const { error } = await sb.from('questions').delete().eq('id', questionId);
  if (error) { alert('Ошибка: ' + error.message); return; }
  renderAdminQuestions(state.currentBlock.id);
}

        <div class="item-title">${escapeHtml(q.text)}</div>
        <div class="item-sub">Блок: <b>${escapeHtml(q.blocks?.name || '—')}</b> · вариантов: ${opts.length}</div>
      </div>`;
    });
  }
  html += `<div class="card"><button class="btn back" onclick="renderAdminPanel()">← Назад</button></div>`;
  app.innerHTML = html;
  window.scrollTo(0, 0);
}
async function renderAdminUsers() {

  const { data: users } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  const roleLabel = r => r === 'admin' ? 'Админ' : r === 'chief' ? 'Начальник' : 'Стажёр';
  let html = `<div class="topbar"><button class="back-btn" onclick="renderAdminPanel()">←</button><div class="title">Пользователи</div></div><h1>👥 Пользователи</h1>
    <div class="info-box">Роли: <b>admin</b> — полный доступ, <b>chief</b> — начальник, <b>cadet</b> — стажёр.</div>
    <div class="meta">Всего: ${users?.length || 0}</div>`;

    html += `<div class="item-card">
      <div class="block-title">
        <div class="item-title">${escapeHtml(u.callsign)}${isMe ? ' <span class="badge">это вы</span>' : ''}</div>
        <span class="badge ${u.role}">${roleLabel(u.role)}</span>
      </div>

          <option value="cadet" ${u.role === 'cadet' ? 'selected' : ''}>Стажёр</option>
          <option value="chief" ${u.role === 'chief' ? 'selected' : ''}>Начальник</option>

async function changeRole(userId, role) {
  const { error } = await sb.from('profiles').update({ role }).eq('id', userId);
  if (error) { alert('Ошибка: ' + error.message); return; }
  if (userId === state.session.user.id) state.profile.role = role;
  renderAdminUsers();
}
async function deleteUser(userId, callsign) {
  if (!confirm(`Удалить ${callsign}?\n\nЕго профиль и все результаты удалятся.\nУчётная запись входа останется — если нужно, удалите её вручную в Supabase.`)) return;
  const { error } = await sb.from('profiles').delete().eq('id', userId);
  if (error) { alert('Ошибка: ' + error.message); return; }
  renderAdminUsers();
}

// ============================================================
// КАБИНЕТ НАЧАЛЬНИКА
// ============================================================
async function renderChiefPanel() {
  state.screen = 'chief';
  app.innerHTML = `<div class="topbar"><button class="back-btn" onclick="renderMenu()">←</button><div class="title">Результаты стажёров</div></div>
    <h1>👁 Результаты стажёров</h1><div class="empty-state"><span class="spinner"></span>Загрузка...</div>`;

  // Загружаем всё нужное
  const [{ data: users }, { data: attempts }, { data: blocks }] = await Promise.all([
    sb.from('profiles').select('*').order('created_at'),
    sb.from('attempts').select('*').not('finished_at', 'is', null).order('finished_at', { ascending: false }),
    sb.from('blocks').select('*'),
  ]);

  state.allUsers = users || [];
  const blockMap = {};
  (blocks || []).forEach(b => { blockMap[b.id] = b.name; });

  // Считаем по каждому стажёру
  const statsByUser = {};
  (users || []).forEach(u => {
    statsByUser[u.id] = { user: u, attempts: [], avg: 0, best: 0, lastAt: null };
  });
  (attempts || []).forEach(a => {
    if (!statsByUser[a.user_id]) return;
    const s = statsByUser[a.user_id];
    s.attempts.push(a);
    if (!s.lastAt || new Date(a.finished_at) > new Date(s.lastAt)) s.lastAt = a.finished_at;
  });
  Object.values(statsByUser).forEach(s => {
    if (s.attempts.length === 0) return;
    const pcts = s.attempts.map(a => a.total > 0 ? (a.score / a.total) * 100 : 0);
    s.avg = Math.round(pcts.reduce((x, y) => x + y, 0) / pcts.length);
    s.best = Math.round(Math.max(...pcts));
  });

  // Общая статистика
  const totalCadets = (users || []).filter(u => u.role === 'cadet').length;
  const totalAttempts = (attempts || []).length;
  const allPcts = (attempts || []).map(a => a.total > 0 ? (a.score / a.total) * 100 : 0);
  const avgAll = allPcts.length ? Math.round(allPcts.reduce((x, y) => x + y, 0) / allPcts.length) : 0;
  const passed = allPcts.filter(p => p >= 60).length;
  const passRate = allPcts.length ? Math.round(passed / allPcts.length * 100) : 0;

  let html = `<div class="topbar"><button class="back-btn" onclick="renderMenu()">←</button><div class="title">Результаты стажёров</div></div>
    <h1>👁 Результаты стажёров</h1>`;

  html += `<div class="kpi-grid">
    <div class="kpi"><div class="kpi-value">${totalCadets}</div><div class="kpi-label">Стажёров</div></div>
    <div class="kpi"><div class="kpi-value">${totalAttempts}</div><div class="kpi-label">Попыток</div></div>
    <div class="kpi"><div class="kpi-value">${avgAll}%</div><div class="kpi-label">Средний балл</div></div>
    <div class="kpi"><div class="kpi-value">${passRate}%</div><div class="kpi-label">Сдали (≥60%)</div></div>
  </div>`;

  html += `<div class="card">
    <div class="row">
      <button class="btn small" onclick="exportResultsCSV()">📥 Экспорт в CSV</button>
      <button class="btn small" onclick="renderChiefPanel()">🔄 Обновить</button>
    </div>
  </div>`;

  // Таблица по стажёрам
  const cadets = (users || []).filter(u => u.role === 'cadet');
  html += `<div class="card"><div class="block-title"><h2>📋 Стажёры</h2></div>`;
  if (cadets.length === 0) {
    html += `<div class="empty-state"><span class="big-emoji">👥</span>Пока нет ни одного стажёра.</div>`;
  } else {
    html += `<div class="table-wrap"><table class="data-table">
      <thead><tr><th>Позывной</th><th class="num">Попыток</th><th class="num">Средний</th><th class="num">Лучший</th><th>Последний раз</th></tr></thead><tbody>`;
    cadets.forEach(u => {
      const s = statsByUser[u.id];
      const avgBadge = s.attempts.length === 0 ? '—' : `<span class="badge ${s.avg >= 75 ? 'green' : s.avg >= 60 ? 'yellow' : 'red'}">${s.avg}%</span>`;
      html += `<tr class="clickable" onclick="renderCadetDetail('${u.id}')" style="cursor:pointer">
        <td><b>${escapeHtml(u.callsign)}</b></td>
        <td class="num">${s.attempts.length}</td>
        <td class="num">${avgBadge}</td>
        <td class="num">${s.attempts.length ? s.best + '%' : '—'}</td>
        <td>${s.lastAt ? fmtDate(s.lastAt) : '—'}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
    html += `<div class="meta" style="margin-top:10px">👆 Нажмите на стажёра, чтобы увидеть его ошибки</div>`;
  }
  html += `</div>`;

  // Топ проблемных вопросов
  const { data: allAnswers } = await sb.from('answers').select('question_id, is_correct').eq('is_correct', false);
  const wrongCount = {};
  (allAnswers || []).forEach(a => { wrongCount[a.question_id] = (wrongCount[a.question_id] || 0) + 1; });
  const topWrongIds = Object.entries(wrongCount).sort((a, b) => b[1] - a[1]).slice(0, 10).map(x => x[0]);
  let topQuestions = [];
  if (topWrongIds.length > 0) {
    const { data: qs } = await sb.from('questions').select('id, text, options, correct_index, block_id').in('id', topWrongIds);
    topQuestions = (qs || []).map(q => ({ ...q, wrongCount: wrongCount[q.id], blockName: blockMap[q.block_id] || '—' }));
    topQuestions.sort((a, b) => b.wrongCount - a.wrongCount);
  }

  html += `<div class="card"><div class="block-title"><h2>🔥 Топ проблемных вопросов</h2></div>`;
  if (topQuestions.length === 0) {
    html += `<div class="empty-state"><span class="big-emoji">✨</span>Пока нет данных об ошибках.</div>`;
  } else {
    const letters = ['а','б','в','г','д','е'];
    topQuestions.forEach((q, i) => {
      const correct = Array.isArray(q.options) && q.options[q.correct_index] ? q.options[q.correct_index] : '';
      html += `<div class="top-q-row">
        <div class="top-q-rank">${i + 1}</div>
        <div class="top-q-body">
          <div class="top-q-text">${escapeHtml(q.text)}</div>
          <div class="top-q-meta">Блок: ${escapeHtml(q.blockName)} · ошиблись <b>${q.wrongCount}</b> раз</div>
          ${correct ? `<div class="top-q-meta" style="color: var(--correct); margin-top:4px">✓ ${letters[q.correct_index]}) ${escapeHtml(correct)}</div>` : ''}
        </div>
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="card"><button class="btn back" onclick="renderMenu()">← Главное меню</button></div>`;
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

// ============================================================
// ДЕТАЛЬНЫЙ РАЗБОР ПО СТАЖЁРУ
// ============================================================
async function renderCadetDetail(userId) {
  state.screen = 'cadetDetail';
  app.innerHTML = `<div class="empty-state"><span class="spinner"></span>Загрузка...</div>`;

  const { data: user } = await sb.from('profiles').select('*').eq('id', userId).single();
  const { data: attempts } = await sb.from('attempts').select('*, blocks(name)').eq('user_id', userId).not('finished_at', 'is', null).order('finished_at', { ascending: false });

  // Все ответы этого пользователя
  const attemptIds = (attempts || []).map(a => a.id);
  let allAnswers = [];
  if (attemptIds.length > 0) {
    const { data: ans } = await sb.from('answers').select('*').in('attempt_id', attemptIds);
    allAnswers = ans || [];
  }

  // Собираем проблемные вопросы (те, где ошиблись)
  const wrongByQ = {};
  allAnswers.filter(a => !a.is_correct).forEach(a => {
    wrongByQ[a.question_id] = (wrongByQ[a.question_id] || 0) + 1;
  });
  const wrongQIds = Object.keys(wrongByQ);
  let wrongQuestions = [];
  if (wrongQIds.length > 0) {
    const { data: qs } = await sb.from('questions').select('*, blocks(name)').in('id', wrongQIds);
    wrongQuestions = (qs || []).map(q => ({ ...q, wrongCount: wrongByQ[q.id] }));
    wrongQuestions.sort((a, b) => b.wrongCount - a.wrongCount);
  }

  const totalAttempts = (attempts || []).length;
  const totalAnswers = allAnswers.length;
  const correctAnswers = allAnswers.filter(a => a.is_correct).length;
  const accuracy = totalAnswers > 0 ? Math.round((correctAnswers / totalAnswers) * 100) : 0;

  let html = `<div class="topbar"><button class="back-btn" onclick="renderChiefPanel()">←</button><div class="title">${escapeHtml(user?.callsign || '')}</div></div>
    <h1>👤 ${escapeHtml(user?.callsign || 'Стажёр')}</h1>`;

  html += `<div class="kpi-grid">
    <div class="kpi"><div class="kpi-value">${totalAttempts}</div><div class="kpi-label">Попыток</div></div>
    <div class="kpi"><div class="kpi-value">${accuracy}%</div><div class="kpi-label">Точность</div></div>
    <div class="kpi"><div class="kpi-value">${correctAnswers}</div><div class="kpi-label">Верных</div></div>
    <div class="kpi"><div class="kpi-value">${totalAnswers - correctAnswers}</div><div class="kpi-label">Ошибок</div></div>
  </div>`;

  // История попыток
  html += `<div class="card"><div class="block-title"><h2>📜 История попыток</h2></div>`;
  if (!attempts || attempts.length === 0) {
    html += `<div class="empty-state"><span class="big-emoji">📭</span>Стажёр ещё не проходил тесты.</div>`;
  } else {
    html += `<div class="table-wrap"><table class="data-table">
      <thead><tr><th>Дата</th><th>Блок</th><th class="num">Результат</th><th class="num">%</th></tr></thead><tbody>`;
    attempts.forEach(a => {
      const pct = a.total > 0 ? Math.round((a.score / a.total) * 100) : 0;
      html += `<tr><td>${fmtDate(a.finished_at)}</td><td>${escapeHtml(a.blocks?.name || '—')}</td><td class="num">${a.score} / ${a.total}</td><td class="num">${pct}%</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;

  // Проблемные вопросы
  html += `<div class="card"><div class="block-title"><h2>❌ Проблемные вопросы</h2></div>
    <div class="meta">Вопросы, где стажёр ошибался. Именно их стоит разобрать.</div>`;
  if (wrongQuestions.length === 0) {
    html += `<div class="empty-state"><span class="big-emoji">🎉</span>Ошибок нет!</div>`;
  } else {
    const letters = ['а','б','в','г','д','е'];
    wrongQuestions.forEach(q => {
      const opts = Array.isArray(q.options) ? q.options : [];
      html += `<div class="err-card">
        <div class="err-q">${escapeHtml(q.text)}</div>
        <div class="err-opts">
          ${opts.map((o, i) => {
            const cls = i === q.correct_index ? 'correct' : '';
            return `<div class="${cls}">${i === q.correct_index ? '✓' : '•'} ${letters[i]}) ${escapeHtml(o)}</div>`;
          }).join('')}
        </div>
        ${q.explain ? `<div class="err-opts" style="margin-top:6px;color:var(--text-dim)"><b>Объяснение:</b> ${escapeHtml(q.explain)}</div>` : ''}
        <div class="err-count">Блок: ${escapeHtml(q.blocks?.name || '—')} · ошибок: <b>${q.wrongCount}</b></div>
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div class="card">
    <button class="btn" onclick="exportCadetCSV('${userId}')">📥 Экспорт ошибок в CSV</button>
    <button class="btn back" onclick="renderChiefPanel()">← К списку стажёров</button>
  </div>`;

  app.innerHTML = html;
  window.scrollTo(0, 0);
  window.__currentCadet = { user, attempts, wrongQuestions };
}

// ============================================================
// ЭКСПОРТ CSV
// ============================================================
function downloadCSV(filename, rows) {
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell == null ? '' : cell);
    if (/[",\n;]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }).join(';')).join('\n');
  // BOM для Excel, чтобы кириллица не кракозябрилась
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function exportResultsCSV() {
  const [{ data: users }, { data: attempts }] = await Promise.all([
    sb.from('profiles').select('*').order('callsign'),
    sb.from('attempts').select('*, blocks(name)').not('finished_at', 'is', null).order('finished_at'),
  ]);
  const userMap = {};
  (users || []).forEach(u => { userMap[u.id] = u; });

  const rows = [['Позывной', 'Роль', 'Дата', 'Блок', 'Правильных', 'Всего', '%']];
  (attempts || []).forEach(a => {
    const u = userMap[a.user_id];
    const pct = a.total > 0 ? Math.round((a.score / a.total) * 100) : 0;
    rows.push([
      u?.callsign || '—',
      u?.role || '—',
      fmtDate(a.finished_at),
      a.blocks?.name || '—',
      a.score,
      a.total,
      pct,
    ]);
  });
  downloadCSV('rubezh_rezultaty_' + new Date().toISOString().slice(0, 10) + '.csv', rows);
}

async function exportCadetCSV(userId) {
  const data = window.__currentCadet;
  if (!data) return;
  const rows = [['Позывной', 'Вопрос', 'Блок', 'Количество ошибок', 'Правильный ответ', 'Объяснение']];
  const letters = ['а','б','в','г','д','е'];
  (data.wrongQuestions || []).forEach(q => {
    const correct = Array.isArray(q.options) && q.options[q.correct_index] ? (letters[q.correct_index] + ') ' + q.options[q.correct_index]) : '';
    rows.push([
      data.user?.callsign || '',
      q.text,
      q.blocks?.name || '',
      q.wrongCount,
      correct,
      q.explain || '',
    ]);
  });
  downloadCSV('rubezh_' + (data.user?.callsign || 'cadet') + '_oshibki.csv', rows);
}

  if (!state.session) { renderAuth(); return; }
  if (!state.profile) {
    app.innerHTML = '<div class="empty-state"><span class="spinner"></span>Загрузка профиля...</div>';
    return;
  }
  renderMenu();
}

// ============================================================
// СТАРТ
// ============================================================
async function init() {
  applyTheme();
  const { data } = await sb.auth.getSession();
  if (data?.session) { state.session = data.session; await loadProfile(); }
  render();
  sb.auth.onAuthStateChange(async (event, session) => {
    state.session = session;
    if (session) await loadProfile(); else state.profile = null;
    render();
  });
}
init();
